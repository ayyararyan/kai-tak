\newlength\CROPmarklineheight
\newlength\CROPmarklength
\newlength\CROPmarkgap
\newlength\CROP@offset@for@lines %

%%%%%%%%%%%%%%%%%%%%%%%%% User configurable values %%%%%%%%%%%%%%%%%%%%%%%%%%%%%
\setlength\CROPmarklength{30\p@}          % thickness of the crop mark line
\setlength\CROPmarklineheight{0.5\p@}     % length of the crop mark line
\setlength\CROPmarkgap{6\p@}              % separation between the marks
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

\setlength\CROP@offset@for@lines{\CROPmarkgap}
\addtolength\CROP@offset@for@lines{\CROPmarklength}
\addtolength\CROP@offset@for@lines{-0.5\CROPmarklineheight}

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% Corner marks %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% upper left corner
\newcommand*\CROP@@trim@ulc{%
  \begin{picture}(0,0)\unitlength\p@\linethickness\CROPmarklineheight
  \put(-\strip@pt\CROP@offset@for@lines,0){\line(1,0){\strip@pt\CROPmarklength}}
  \put(0,\strip@pt\CROP@offset@for@lines){\line(0,-1){\strip@pt\CROPmarklength}}
  \end{picture}}
% upper right corner
\newcommand*\CROP@@trim@urc{%
  \begin{picture}(0,0)\unitlength\p@\linethickness\CROPmarklineheight
  \put(\strip@pt\CROP@offset@for@lines,0){\line(-1,0){\strip@pt\CROPmarklength}}
  \put(0,\strip@pt\CROP@offset@for@lines){\line(0,-1){\strip@pt\CROPmarklength}}
  \end{picture}}
% lower left corner
\newcommand*\CROP@@trim@llc{%
  \begin{picture}(0,0)\unitlength\p@\linethickness\CROPmarklineheight
  \put(-\strip@pt\CROP@offset@for@lines,0){\line(1,0){\strip@pt\CROPmarklength}}
  \put(0,-\strip@pt\CROP@offset@for@lines){\line(0,1){\strip@pt\CROPmarklength}}
  \end{picture}}
% lower right corner
\newcommand*\CROP@@trim@lrc{%
  \begin{picture}(0,0)\unitlength\p@\linethickness\CROPmarklineheight
  \put(\strip@pt\CROP@offset@for@lines,0){\line(-1,0){\strip@pt\CROPmarklength}}
  \put(0,-\strip@pt\CROP@offset@for@lines){\line(0,1){\strip@pt\CROPmarklength}}
  \end{picture}}
%%%%%%%%%%%%%%%%%%%%%%%%%%%%% End corner marks %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% Info line %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
\newcommand*\CROP@@trim@info{{%
    \global\advance\CROP@index\@ne
    \def\x{\discretionary{}{}{\hbox{\kern.5em---\kern.5em}}}%
    \advance\paperwidth-20\p@
    \dimen@4pt
    \ifx\CROP@pagecolor\@empty
    \else
        \advance\dimen@\CROP@overlap
    \fi
    \hb@xt@\z@{%
        \hss
        \vbox to\z@{%
            \centering
            \hsize\paperwidth
            \vskip-2pc
        \fontfamily{\default@family}%
        \fontseries{\default@series}%
        \fontshape{\default@shape}%
        \selectfont     
            \small
            \expandafter\csname\CROP@font\endcsname{%
                \strut
            }%
            \vskip2pc
            \vskip\dimen@
            \vss
        }%
        \hss
    }%
}}

%%%%%%%%%%%%%%%%%%%%%%%%%%%%% End info line %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

\cropdef[\CROP@@trim@info]
       \CROP@@trim@ulc\CROP@@trim@urc\CROP@@trim@llc\CROP@@trim@lrc{cam}
\endinput
