<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Where the runway goes — constructed landing scenarios</title>
<desc id="chart-desc">Two proportional distance allocations on a common 2786 metre runway scale. Calm air: touchdown at 313.49 metres, 155.78 metres of delay travel, 2062.05 metres of braking and 254.68 metres remaining. Steady wind: touchdown at 302.11 metres, 144.98 metres of delay travel, 1786.14 metres of braking and 552.77 metres remaining. The dotted line is a 150 metre stopping reserve marker.</desc>
<style>
 .eyebrow{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#70818A}
 .title{font:normal 43px Georgia,"Times New Roman",serif;fill:#1C303C}
 .subtitle{font:normal 16px Arial,Helvetica,sans-serif;fill:#62717A}
 .legend{font:normal 15px Arial,Helvetica,sans-serif;fill:#2D414D}
 .index{font:700 15px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#B66549}
 .scenario{font:normal 32px Georgia,"Times New Roman",serif;fill:#1C303C}
 .scenario-detail{font:normal 13px Arial,Helvetica,sans-serif;letter-spacing:.55px;fill:#75858A}
 .reserve-caption{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:1.4px;fill:#738575}
 .reserve{font:normal 35px Georgia,"Times New Roman",serif;fill:#698367}
 .point-label{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#71818A}
 .point-value{font:normal 17px Arial,Helvetica,sans-serif;fill:#2B4251}
 .tick{font:normal 14px Arial,Helvetica,sans-serif;fill:#667681}
 .note{font:normal 13px Arial,Helvetica,sans-serif;fill:#65747D}
</style>
